name: Atualizar painel

on:
  schedule:
    - cron: "0 9 * * *"      # todo dia às 09:00 UTC (06:00 em Brasília)
  workflow_dispatch:         # botão "Run workflow" para rodar na hora
  push:
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      # Restaura os CSVs da última execução: se uma fonte falhar hoje, o painel
      # continua com o último dado bom dela em vez de perder a série.
      - uses: actions/cache@v4
        with:
          path: data/series
          key: series-${{ github.run_id }}
          restore-keys: series-

      - name: Coletar fontes
        run: python -m painel.collect || echo "::warning::alguma fonte falhou; usando dados anteriores dela"

      - name: Gerar painel
        run: python -m painel.build

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dashboard

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
