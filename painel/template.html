<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Painel Imobiliário Brasil</title>
<style>
:root{
  color-scheme:light;
  --page:#f9f9f7; --surface:#fcfcfb; --ink:#0b0b0b; --ink-2:#52514e; --muted:#898781;
  --grid:#e1e0d9; --axis:#c3c2b7; --border:rgba(11,11,11,.10); --hover:rgba(11,11,11,.04);
  --s1:#2a78d6; --s2:#eb6834; --s3:#1baf7a; --s4:#eda100; --s5:#e87ba4; --s6:#008300; --s7:#6250d6; --s8:#e34948;
  --good:#006300; --bad:#d03b3b; --accent:#2a78d6;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
    --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);
    --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
    --good:#0ca30c; --bad:#e66767; --accent:#3987e5;
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --page:#0d0d0d; --surface:#1a1a19; --ink:#f0efec; --ink-2:#c3c2b7; --muted:#898781;
  --grid:#2c2c2a; --axis:#383835; --border:rgba(255,255,255,.10); --hover:rgba(255,255,255,.05);
  --s1:#3987e5; --s2:#d95926; --s3:#199e70; --s4:#c98500; --s5:#d55181; --s6:#008300; --s7:#9085e9; --s8:#e66767;
  --good:#0ca30c; --bad:#e66767; --accent:#3987e5;
}
*{box-sizing:border-box}
html,body{margin:0;background:var(--page);color:var(--ink);font:14px/1.45 system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}
header{padding:20px 16px 0;max-width:1280px;margin:0 auto}
h1{font-size:22px;margin:0 0 2px;font-weight:650;letter-spacing:-.01em}
.sub{color:var(--ink-2);font-size:13px;margin:0 0 14px}
nav{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--grid)}
nav button{background:none;border:0;border-bottom:2px solid transparent;color:var(--ink-2);padding:8px 12px;font:inherit;font-weight:500;cursor:pointer;margin-bottom:-1px}
nav button[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--accent)}
nav button:hover{background:var(--hover)}
main{max-width:1280px;margin:0 auto;padding:14px 16px 48px}
.filters{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin:0 0 14px;color:var(--ink-2);font-size:13px}
.filters label{display:flex;gap:6px;align-items:center}
.filters select,.filters .seg{font:inherit;color:var(--ink);background:var(--surface);border:1px solid var(--border);border-radius:6px;padding:5px 8px}
.seg{display:inline-flex;padding:2px;gap:2px}
.seg button{font:inherit;border:0;background:none;color:var(--ink-2);padding:3px 9px;border-radius:4px;cursor:pointer}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--ink);font-weight:600}
section[hidden]{display:none}
.grid{display:grid;gap:12px;grid-template-columns:repeat(12,1fr)}
.card{background:var(--surface);border:1px solid var(--border);border-radius:10px;padding:14px 16px 10px;min-width:0}
.c12{grid-column:span 12}.c6{grid-column:span 6}.c4{grid-column:span 4}.c3{grid-column:span 3}.c8{grid-column:span 8}
@media(max-width:900px){.c6,.c4,.c8{grid-column:span 12}.c3{grid-column:span 6}}
@media(max-width:560px){.c3{grid-column:span 12}}
.card h3{margin:0;font-size:14px;font-weight:600}
.card .note{margin:2px 0 8px;color:var(--muted);font-size:12px}
.card .src{margin:6px 0 0;color:var(--muted);font-size:11px}
.tile .label{color:var(--ink-2);font-size:12px}
.tile .value{font-size:26px;font-weight:600;line-height:1.15;margin:2px 0}
.tile.hero .value{font-size:44px}
.tile .delta{font-size:12px;color:var(--ink-2)}
.tile .delta b{font-weight:600}
.up{color:var(--good)}.down{color:var(--bad)}
.tile .ref{color:var(--muted);font-size:11px}
.chart{position:relative;width:100%;height:260px}
.chart.tall{height:320px}
.chart svg{display:block;width:100%;height:100%;overflow:visible}
.chart .grid-line{stroke:var(--grid);stroke-width:1}
.chart .axis-line{stroke:var(--axis);stroke-width:1}
.chart text{fill:var(--muted);font-size:11px;font-variant-numeric:tabular-nums}
.chart .line{fill:none;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.chart .area{opacity:.10}
.chart .end-dot{stroke:var(--surface);stroke-width:2}
.chart .end-label{fill:var(--ink-2);font-size:11px}
.chart .xhair{stroke:var(--axis);stroke-width:1;pointer-events:none}
.chart .hit{fill:transparent}
.chart rect.bar{shape-rendering:crispEdges}
.chart rect.bar:hover{filter:brightness(1.12)}
.legend{display:flex;gap:14px;flex-wrap:wrap;margin:6px 0 0;font-size:12px;color:var(--ink-2)}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{display:inline-block;width:14px;height:0;border-top:2px solid;border-radius:1px}
.legend i.sq{width:10px;height:10px;border:0;border-radius:2px}
.tip{position:absolute;pointer-events:none;background:var(--surface);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:12px;box-shadow:0 4px 16px rgba(0,0,0,.12);min-width:150px;z-index:5;display:none}
.tip .d{color:var(--muted);margin-bottom:4px}
.tip .r{display:flex;justify-content:space-between;gap:12px;align-items:center}
.tip .r i{display:inline-block;width:12px;border-top:2px solid;margin-right:6px}
.tip .r b{font-weight:600;font-variant-numeric:tabular-nums}
.tip .r span{color:var(--ink-2)}
table{border-collapse:collapse;width:100%;font-size:12.5px}
th,td{padding:6px 8px;border-bottom:1px solid var(--grid);text-align:left;vertical-align:top}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums}
th{color:var(--ink-2);font-weight:600;position:sticky;top:0;background:var(--surface)}
.tablewrap{max-height:520px;overflow:auto;border:1px solid var(--border);border-radius:8px}
details summary{cursor:pointer;color:var(--ink-2);font-size:12px;margin-top:6px}
.badge{display:inline-block;font-size:11px;padding:1px 7px;border-radius:999px;border:1px solid var(--border);color:var(--ink-2);margin-left:6px}
.theme{margin-left:auto}
.empty{color:var(--muted);font-size:12px;padding:20px 0}
.st{display:inline-flex;align-items:center;gap:6px;font-weight:600;white-space:nowrap}
.st i{width:10px;height:10px;border-radius:50%;display:inline-block}
.st.good i{background:#0ca30c}.st.warn i{background:#fab219}.st.bad i{background:#d03b3b}
.sem{table-layout:fixed}.sem td{vertical-align:middle}.sem .ref{color:var(--muted);font-size:11.5px}
.sem th:nth-child(1){width:27%}.sem th:nth-child(2){width:11%}.sem th:nth-child(3){width:12%}.sem th:nth-child(4){width:11%}
.sem td.n,.sem td:nth-child(3){white-space:nowrap}
.info{display:inline-flex;align-items:center;justify-content:center;width:16px;height:16px;border-radius:50%;border:1px solid var(--muted);color:var(--muted);background:none;font:600 11px/1 Georgia,serif;cursor:help;vertical-align:middle;padding:0}
.info:hover,.info:focus{color:var(--accent);border-color:var(--accent);outline:none}
.infobox{font-size:12px;color:var(--ink-2);max-width:420px;line-height:1.4}
.infobox div+div{margin-top:5px}.infobox b{color:var(--ink)}
.infobox.inline{max-width:none;margin:4px 0 8px;padding:8px 10px;border-left:2px solid var(--accent);background:var(--hover);border-radius:0 6px 6px 0}
.sem .formula{color:var(--ink-2);font-size:11.5px;margin-top:2px}.sem .formula b{color:var(--ink);font-weight:600}
.sem .formula code{font:11px/1.3 ui-monospace,Consolas,monospace}
</style>
</head>
<body>
<header>
  <h1>Painel Imobiliário Brasil</h1>
  <p class="sub">Inteligência de mercado consolidada de fontes públicas · dados coletados em <span id="built"></span></p>
  <nav id="nav" role="tablist"></nav>
</header>
<main>
  <div class="filters" id="filters">
    <label>Período
      <span class="seg" id="range">
        <button data-y="3">3 anos</button><button data-y="5" aria-pressed="true">5 anos</button><button data-y="10">10 anos</button><button data-y="99">Tudo</button>
      </span>
    </label>
    <label id="ufwrap">UF <select id="uf"></select></label>
    <label id="citywrap">Capital (preços) <select id="city"></select></label>
    <label class="theme">Tema <select id="theme"><option value="">Sistema</option><option value="light">Claro</option><option value="dark">Escuro</option></select></label>
  </div>
  <div id="views"></div>
</main>
<div class="tip" id="tip"></div>

<script>
const PAYLOAD = /*__DATA__*/;
const D = PAYLOAD.data;
const COLORS = ['--s1','--s2','--s3','--s4','--s5','--s6','--s7','--s8'].map(v=>`var(${v})`);
const UF_NAMES = {BR:'Brasil',AC:'Acre',AL:'Alagoas',AM:'Amazonas',AP:'Amapá',BA:'Bahia',CE:'Ceará',DF:'Distrito Federal',ES:'Espírito Santo',GO:'Goiás',MA:'Maranhão',MG:'Minas Gerais',MS:'Mato Grosso do Sul',MT:'Mato Grosso',PA:'Pará',PB:'Paraíba',PE:'Pernambuco',PI:'Piauí',PR:'Paraná',RJ:'Rio de Janeiro',RN:'Rio Grande do Norte',RO:'Rondônia',RR:'Roraima',RS:'Rio Grande do Sul',SC:'Santa Catarina',SE:'Sergipe',SP:'São Paulo',TO:'Tocantins'};
const state = {view:'visao', years:5, uf:'BR', city:'São Paulo'};
const IPCA_BASE='2014-01';
function ipcaIndex(base=IPCA_BASE){ let acc=100; return S('bcb_sgs','ipca').filter(p=>p[0]>=base).map(p=>{acc*=1+p[1]/100; return [p[0],acc];}); }

// ---------- acesso a dados ----------
function S(src, sid, region='BR'){ const e = D[src]?.[sid]; if(!e) return []; return e.regions[region] || e.regions[Object.keys(e.regions)[0]] || []; }
function has(src,sid,region){ return !!(D[src]?.[sid]?.regions[region]); }
function regionsOf(src,sid){ return Object.keys(D[src]?.[sid]?.regions||{}); }
const last = s => s.length ? s[s.length-1] : null;
const lastN = (s,n) => s.slice(Math.max(0,s.length-n));
function rollN(s,n){ const o=[]; for(let i=n-1;i<s.length;i++){ let t=0; for(let j=i-n+1;j<=i;j++) t+=s[j][1]; o.push([s[i][0],t]); } return o; }
const roll12 = s => rollN(s,12);
const roll4 = s => rollN(s,4); // 4 trimestres = 12 meses
function yoy(s){ const m=new Map(s.map(p=>[p[0],p[1]])); return s.filter(p=>m.has(prevYear(p[0]))).map(p=>[p[0],(p[1]/m.get(prevYear(p[0]))-1)*100]); }
function prevYear(ym){ return (parseInt(ym.slice(0,4))-1)+ym.slice(4); }
function index100(s, base){ const b = base ? s.find(p=>p[0]>=base) : s[0]; if(!b) return []; return s.filter(p=>p[0]>=b[0]).map(p=>[p[0],p[1]/b[1]*100]); }
function scale(s,k){ return s.map(p=>[p[0],p[1]*k]); }
function diffPct(s,n){ if(s.length<=n) return null; const a=s[s.length-1][1], b=s[s.length-1-n][1]; return b? (a/b-1)*100 : null; }
function diffAbs(s,n){ if(s.length<=n) return null; return s[s.length-1][1]-s[s.length-1-n][1]; }
function cut(s){ if(state.years>=99) return s; const y=new Date().getFullYear()-state.years; return s.filter(p=>p[0]>=`${y}-01`); }
function sum(arr){ return arr.reduce((a,b)=>a+b,0); }

// ---------- formatação ----------
const nf = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:1});
const nf0 = new Intl.NumberFormat('pt-BR',{maximumFractionDigits:0});
const nf2 = new Intl.NumberFormat('pt-BR',{minimumFractionDigits:1,maximumFractionDigits:2});
function fmtBRL(v){ const a=Math.abs(v); if(a>=1e12) return 'R$ '+nf2.format(v/1e12)+' tri'; if(a>=1e9) return 'R$ '+nf.format(v/1e9)+' bi'; if(a>=1e6) return 'R$ '+nf.format(v/1e6)+' mi'; if(a>=1e3) return 'R$ '+nf.format(v/1e3)+' mil'; return 'R$ '+nf.format(v); }
function fmtNum(v){ const a=Math.abs(v); if(a>=1e9) return nf.format(v/1e9)+' bi'; if(a>=1e6) return nf.format(v/1e6)+' mi'; if(a>=1e4) return nf.format(v/1e3)+' mil'; return nf.format(v); }
function fmtPct(v,d=1){ return (v>0?'+':'')+v.toFixed(d).replace('.',',')+'%'; }
function fmtBy(unit){ if(unit==='R$'||unit==='R$ mi'||unit==='R$ mil'||unit==='R$/m²') return v=>fmtBRL(v); if(unit==='%'||unit==='% a.a.'||unit==='% a.m.'||unit==='pp') return v=>nf2.format(v)+'%'; return v=>fmtNum(v); }
const MESES=['jan','fev','mar','abr','mai','jun','jul','ago','set','out','nov','dez'];
function fmtYM(ym){ return MESES[parseInt(ym.slice(5,7))-1]+'/'+ym.slice(2,4); }
function fmtYMlong(ym){ return MESES[parseInt(ym.slice(5,7))-1]+'/'+ym.slice(0,4); }
function fmtQ(ym){ return 'T'+(Math.floor((parseInt(ym.slice(5,7))-1)/3)+1)+'/'+ym.slice(2,4); }
function el(tag, attrs={}, ...kids){ const e=document.createElement(tag); for(const [k,v] of Object.entries(attrs)){ if(k==='class') e.className=v; else if(k==='html') e.innerHTML=v; else if(k.startsWith('on')) e.addEventListener(k.slice(2),v); else e.setAttribute(k,v);} for(const k of kids){ if(k==null) continue; e.append(k.nodeType?k:document.createTextNode(k)); } return e; }

// ---------- gráficos (SVG puro) ----------
const NS='http://www.w3.org/2000/svg';
function svgEl(t,a={}){ const e=document.createElementNS(NS,t); for(const [k,v] of Object.entries(a)) e.setAttribute(k,v); return e; }
function niceTicks(min,max,n=4){ if(min===max){ max=min+1; } const span=max-min, step0=span/n, p=Math.pow(10,Math.floor(Math.log10(step0))), f=step0/p; const step=p*(f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10); const lo=Math.floor(min/step)*step, hi=Math.ceil(max/step)*step; const t=[]; for(let v=lo;v<=hi+step/2;v+=step) t.push(+v.toFixed(10)); return t; }
const tip = document.getElementById('tip');
function showTip(x,y,html){ tip.innerHTML=''; tip.append(html); tip.style.display='block'; const r=tip.getBoundingClientRect(); let L=x+14, T=y+14; if(L+r.width>window.innerWidth-8) L=x-r.width-14; if(T+r.height>window.innerHeight-8) T=y-r.height-14; tip.style.left=L+'px'; tip.style.top=T+'px'; }
function hideTip(){ tip.style.display='none'; }

/* lineChart(container, {series:[{name,data,color?}], fmt, freq, zero?, labelEnd?}) */
function lineChart(box, opt){
  box.innerHTML='';
  const W=box.clientWidth||600, H=box.clientHeight||260, m={t:10,r:opt.labelEnd?74:16,b:24,l:8};
  const series = opt.series.filter(s=>s.data.length);
  if(!series.length){ box.append(el('div',{class:'empty'},'Sem dados para o recorte selecionado.')); return; }
  const dates=[...new Set(series.flatMap(s=>s.data.map(p=>p[0])))].sort();
  const xi=new Map(dates.map((d,i)=>[d,i]));
  let vals=series.flatMap(s=>s.data.map(p=>p[1])); let lo=Math.min(...vals), hi=Math.max(...vals);
  if(opt.zero!==false){ lo=Math.min(lo,0); hi=Math.max(hi,0); }
  const ticks=niceTicks(lo,hi); lo=ticks[0]; hi=ticks[ticks.length-1];
  const fmt=opt.fmt||fmtNum;
  const labW = Math.max(...ticks.map(t=>fmt(t).length))*6.4+8; m.l=Math.max(m.l,labW);
  const x=i=>m.l+(dates.length>1? i/(dates.length-1):0.5)*(W-m.l-m.r), y=v=>m.t+(1-(v-lo)/(hi-lo))*(H-m.t-m.b);
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`});
  for(const t of ticks){ svg.append(svgEl(t===0||t===lo?'line':'line',{x1:m.l,x2:W-m.r,y1:y(t),y2:y(t),class:(t===0&&lo<0)?'axis-line':'grid-line'})); const tx=svgEl('text',{x:m.l-6,y:y(t)+4,'text-anchor':'end'}); tx.textContent=fmt(t); svg.append(tx); }
  const fx = opt.freq==='Q'?fmtQ:fmtYM; const step=Math.ceil(dates.length/Math.max(2,Math.floor((W-m.l-m.r)/70)));
  dates.forEach((d,i)=>{ if(i%step===0||i===dates.length-1){ const tx=svgEl('text',{x:x(i),y:H-6,'text-anchor':i===dates.length-1?'end':'middle'}); tx.textContent=fx(d); svg.append(tx);} });
  series.forEach((s,k)=>{
    const col=s.color||COLORS[k%8];
    const pts=s.data.map(p=>`${x(xi.get(p[0])).toFixed(1)},${y(p[1]).toFixed(1)}`);
    if(opt.area && series.length===1){ const a=svgEl('path',{class:'area',fill:col,d:`M${pts[0]} L${pts.join(' L')} L${x(xi.get(s.data[s.data.length-1][0]))},${y(Math.max(lo,0))} L${x(xi.get(s.data[0][0]))},${y(Math.max(lo,0))} Z`}); svg.append(a); }
    svg.append(svgEl('path',{class:'line',stroke:col,d:'M'+pts.join(' L')}));
    const e=s.data[s.data.length-1]; svg.append(svgEl('circle',{class:'end-dot',cx:x(xi.get(e[0])),cy:y(e[1]),r:4,fill:col}));
    if(opt.labelEnd){ const tx=svgEl('text',{class:'end-label',x:x(xi.get(e[0]))+8,y:y(e[1])+4}); tx.textContent=fmt(e[1]); svg.append(tx); }
  });
  const xh=svgEl('line',{class:'xhair',y1:m.t,y2:H-m.b,x1:0,x2:0,visibility:'hidden'}); svg.append(xh);
  const hit=svgEl('rect',{class:'hit',x:m.l,y:0,width:Math.max(1,W-m.l-m.r),height:H}); svg.append(hit);
  hit.addEventListener('pointermove',ev=>{ const r=svg.getBoundingClientRect(); const px=(ev.clientX-r.left)*W/r.width; const i=Math.max(0,Math.min(dates.length-1,Math.round((px-m.l)/(W-m.l-m.r)*(dates.length-1)))); xh.setAttribute('x1',x(i)); xh.setAttribute('x2',x(i)); xh.setAttribute('visibility','visible');
    const d=dates[i]; const box=el('div'); box.append(el('div',{class:'d'},opt.freq==='Q'?fmtQ(d):fmtYMlong(d)));
    series.forEach((s,k)=>{ const p=s.data.find(q=>q[0]===d); if(!p) return; const row=el('div',{class:'r'}); const i2=el('i'); i2.style.borderColor=s.color||COLORS[k%8]; const sp=el('span'); sp.textContent=s.name; row.append(el('span',{},i2,sp), el('b',{},fmt(p[1]))); box.append(row); });
    showTip(ev.clientX,ev.clientY,box); });
  hit.addEventListener('pointerleave',()=>{ xh.setAttribute('visibility','hidden'); hideTip(); });
  box.append(svg);
  if(series.length>1){ const lg=el('div',{class:'legend'}); series.forEach((s,k)=>{ const i=el('i'); i.style.borderColor=s.color||COLORS[k%8]; const sp=el('span'); sp.append(i, document.createTextNode(s.name)); lg.append(sp); }); box.after(lg); box._legend=lg; }
}

/* barChart(container, {series:[{name,data}], fmt, stacked:true}) — colunas empilhadas, gap 2px */
function barChart(box, opt){
  box.innerHTML='';
  const W=box.clientWidth||600, H=box.clientHeight||260, m={t:10,r:12,b:24,l:8};
  const series=opt.series.filter(s=>s.data.length);
  if(!series.length){ box.append(el('div',{class:'empty'},'Sem dados para o recorte selecionado.')); return; }
  const dates=[...new Set(series.flatMap(s=>s.data.map(p=>p[0])))].sort();
  const maps=series.map(s=>new Map(s.data));
  const tot=dates.map(d=>sum(maps.map(mp=>Math.max(0,mp.get(d)||0))));
  const ticks=niceTicks(0,opt.max!=null?opt.max:Math.max(...tot)); const hi=ticks[ticks.length-1];
  const fmt=opt.fmt||fmtNum; m.l=Math.max(m.l,Math.max(...ticks.map(t=>fmt(t).length))*6.4+8);
  const bw=(W-m.l-m.r)/dates.length, bar=Math.min(24,Math.max(2,bw*0.7));
  const x=i=>m.l+i*bw+(bw-bar)/2, y=v=>m.t+(1-v/hi)*(H-m.t-m.b);
  const svg=svgEl('svg',{viewBox:`0 0 ${W} ${H}`});
  for(const t of ticks){ svg.append(svgEl('line',{x1:m.l,x2:W-m.r,y1:y(t),y2:y(t),class:t===0?'axis-line':'grid-line'})); const tx=svgEl('text',{x:m.l-6,y:y(t)+4,'text-anchor':'end'}); tx.textContent=fmt(t); svg.append(tx); }
  const fx = opt.freq==='Q'?fmtQ:fmtYM; const step=Math.ceil(dates.length/Math.max(2,Math.floor((W-m.l-m.r)/70)));
  dates.forEach((d,i)=>{ if(i%step===0||i===dates.length-1){ const tx=svgEl('text',{x:x(i)+bar/2,y:H-6,'text-anchor':'middle'}); tx.textContent=fx(d); svg.append(tx);} });
  dates.forEach((d,i)=>{
    let acc=0; const g=svgEl('g');
    series.forEach((s,k)=>{ const v=Math.max(0,maps[k].get(d)||0); if(!v) return; const y1=y(acc+v), y0=y(acc); const h=Math.max(0,y0-y1-(acc>0?2:0)); const r=svgEl('rect',{class:'bar',x:x(i),y:y1,width:bar,height:h,fill:s.color||COLORS[k%8],rx:k===series.length-1||h<4?3:0}); g.append(r); acc+=v; });
    const hit=svgEl('rect',{class:'hit',x:m.l+i*bw,y:m.t,width:bw,height:H-m.t-m.b}); g.append(hit);
    const show=ev=>{ const bx=el('div'); bx.append(el('div',{class:'d'},opt.freq==='Q'?fmtQ(d):fmtYMlong(d))); series.forEach((s,k)=>{ const v=maps[k].get(d); if(v==null) return; const row=el('div',{class:'r'}); const i2=el('i'); i2.style.borderColor=s.color||COLORS[k%8]; const sp=el('span'); sp.textContent=s.name; row.append(el('span',{},i2,sp), el('b',{},fmt(v))); bx.append(row); }); if(series.length>1){ const row=el('div',{class:'r'}); row.append(el('span',{},'Total'), el('b',{},fmt(tot[i]))); bx.append(row);} showTip(ev.clientX,ev.clientY,bx); };
    g.addEventListener('pointermove',show); g.addEventListener('pointerleave',hideTip);
    svg.append(g);
  });
  box.append(svg);
  if(series.length>1){ const lg=el('div',{class:'legend'}); series.forEach((s,k)=>{ const i=el('i',{class:'sq'}); i.style.background=s.color||COLORS[k%8]; const sp=el('span'); sp.append(i, document.createTextNode(s.name)); lg.append(sp); }); box.after(lg); }
}

const charts=[]; // para re-render em resize
function chartCard({title,note,src,span=6,tall=false,render,table,info}){
  const card=el('div',{class:`card c${span}`});
  const h=el('h3',{},title); if(info&&INFO[info]) h.append(' ',infoBadge(info)); card.append(h); if(note) card.append(el('p',{class:'note'},note));
  const box=el('div',{class:'chart'+(tall?' tall':'')}); card.append(box);
  if(src) card.append(el('p',{class:'src'},'Fonte: '+src));
  if(table){ const det=el('details'); det.append(el('summary',{},'Ver tabela')); const wrap=el('div',{class:'tablewrap'}); det.append(wrap); card.append(det); det.addEventListener('toggle',()=>{ if(det.open&&!wrap.children.length) wrap.append(dataTable(table())); }); }
  charts.push({box,render}); queueMicrotask(()=>{ card._lg&&card._lg.remove(); render(box); });
  return card;
}
function dataTable(series){ // series: [{name,data,fmt}]
  const dates=[...new Set(series.flatMap(s=>s.data.map(p=>p[0])))].sort().reverse();
  const t=el('table'); const tr=el('tr'); tr.append(el('th',{},'Período')); series.forEach(s=>tr.append(el('th',{class:'n'},s.name))); t.append(el('thead',{},tr));
  const tb=el('tbody'); for(const d of dates){ const r=el('tr'); r.append(el('td',{},fmtYMlong(d))); series.forEach(s=>{ const p=s.data.find(q=>q[0]===d); r.append(el('td',{class:'n'},p?(s.fmt||fmtNum)(p[1]):'–')); }); tb.append(r);} t.append(tb); return t;
}
function tile({label,value,delta,deltaLabel,ref,hero=false,upGood=true,span=3}){
  const c=el('div',{class:`card tile c${span}`+(hero?' hero':'')});
  c.append(el('div',{class:'label'},label), el('div',{class:'value'},value));
  if(delta!=null && isFinite(delta)){ const cls=(delta>=0)===upGood?'up':'down'; const d=el('div',{class:'delta'}); d.append(el('b',{class:cls},(typeof delta==='number'?fmtPct(delta):delta)), ' '+(deltaLabel||'vs. 12 meses antes')); c.append(d); }
  if(ref) c.append(el('div',{class:'ref'},ref));
  return c;
}

// ---------- indicadores derivados (aba Ciclo) ----------
function join(a,b,fn){ const m=new Map(b); return a.filter(p=>m.has(p[0])).map(p=>[p[0],fn(p[1],m.get(p[0]))]); }
function chainIndex(monthlyPct, base){ let acc=100; return monthlyPct.filter(p=>p[0]>=base).map(p=>{acc*=1+p[1]/100; return [p[0],acc];}); }
function pmt(P,rateAA,n=360){ const i=Math.pow(1+rateAA/100,1/12)-1; return P*i/(1-Math.pow(1+i,-n)); }
function status(v,[g,w],higherIsBad=true){ if(v==null||!isFinite(v)) return null; if(higherIsBad) return v<=g?'good':v<=w?'warn':'bad'; return v>=g?'good':v>=w?'warn':'bad'; }
const ST_LABEL={good:'favorável',warn:'atenção',bad:'desfavorável'};
function stPill(s){ const e=el('span',{class:'st '+(s||'')}); e.append(el('i'), ST_LABEL[s]||'–'); return e; }

function infoBadge(key, inline=true){ const i=INFO[key]; if(!i) return null; const b=el('button',{class:'info',type:'button','aria-label':'Fórmula e significado'},'i');
  b.addEventListener('pointerenter',ev=>showTip(ev.clientX,ev.clientY,infoBox(key))); b.addEventListener('pointermove',ev=>showTip(ev.clientX,ev.clientY,infoBox(key))); b.addEventListener('pointerleave',hideTip);
  b.addEventListener('focus',()=>{ const r=b.getBoundingClientRect(); showTip(r.left,r.bottom,infoBox(key)); }); b.addEventListener('blur',hideTip);
  if(inline) b.addEventListener('click',()=>{ hideTip(); const card=b.closest('.card'); let x=card.querySelector('.infobox.inline'); if(x){ x.remove(); return; } x=infoBox(key); x.classList.add('inline'); card.querySelector('h3').after(x); });
  return b; }

function ciclo(){
  const sel=S('bcb_sgs','selic_meta_m'), ipca12=S('bcb_sgs','ipca_12m'), ipca=S('bcb_sgs','ipca');
  const C=(k,r='BR')=>S('bcb_olinda',k,r);
  const out={};
  out.juroReal = join(sel,ipca12,(a,b)=>a-b);
  out.spread = join(C('credito_contratacao_taxa_pf_sfh'),sel,(a,b)=>a-b);
  // CBIC (trimestral)
  const cbL=S('cbic','lancamentos','BR'), cbV=S('cbic','vendas','BR'), cbO=S('cbic','oferta','BR');
  out.absorcao = join(cbV,cbL,(v,l)=>v-l);
  out.absorcao12 = join(roll4(cbV),roll4(cbL),(v,l)=>v-l);
  out.absorcaoPct = join(out.absorcao12,roll4(cbV),(a,v)=>a/v*100);
  out.reposicao = join(roll4(cbL),roll4(cbV),(l,v)=>l/v);
  out.mesesEstoque = join(cbO,roll4(cbV),(o,v)=>o/(v/12));
  out.mesesRegiao = ['Sudeste','Sul','Nordeste','Centro-Oeste','Norte'].map(r=>({name:r,data:join(S('cbic','oferta',r),roll4(S('cbic','vendas',r)),(o,v)=>o/(v/12))}));
  // Abrainc distratos
  out.distratos = join(S('abrainc','distratos_total'),S('abrainc','vendas_total'),(d,v)=>d/v*100);
  // preço ÷ custo: IGMI-R (jan/2014=100) ÷ INCC encadeado (jan/2014=100)
  const incc=chainIndex(S('bcb_sgs','incc_di'),'2014-01');
  out.precoCusto = join(S('abecip','igmi_r','BR'),incc,(p,c)=>p/c*100);
  out.precoCustoYoy = yoy(out.precoCusto);
  // prestação do imóvel mediano (MVG-R × LTV SFH, taxa SFH, 360 meses, tabela Price), nominal e real (IPCA até o último mês)
  const mvg=C('indices_mvg_r'), ltv=C('credito_contratacao_ltv_pf_sfh'), tx=C('credito_contratacao_taxa_pf_sfh');
  const presNom=join(join(mvg,ltv,(m,l)=>m*l/100),tx,(P,t)=>pmt(P,t));
  const ipIdx=chainIndex(ipca,'2014-01'); const ipLast=last(ipIdx)?last(ipIdx)[1]:100;
  out.prestacaoReal=join(presNom,ipIdx,(p,i)=>p*ipLast/i);
  out.prestacaoNom=presNom;
  // ticket médio SBPE (R$) e share FGTS (12m) e cobertura da carteira
  out.ticket = join(S('abecip','sbpe_rs_total'),S('abecip','sbpe_unid_total'),(r,u)=>r*1e6/u);
  const fontes=['sfh','fgts','livre','home_equity'].map(k=>C(`credito_contratacao_contratado_pf_${k}`));
  out.shareFgts = join(roll12(fontes[1]),roll12(mergeSum(fontes)),(f,t)=>f/t*100);
  out.cobertura = join(C('credito_estoque_carteira_credito_pf_sfh'),C('fontes_sbpe_saldo'),(c,s)=>c/s*100);
  out.inad = C('credito_estoque_inadimplencia_pf_sfh');
  return out;
}

// ---------- segmentos CBIC: MCMV × MAP (médio e alto padrões = tudo que não é MCMV) ----------
const SEG=[['mcmv','MCMV'],['map','MAP (médio e alto padrões)']];
const SEG_SHORT={mcmv:'MCMV',map:'MAP'};
function segMetrics(){
  const CB=k=>S('cbic',k,'BR'); const o={};
  for(const [k,nm] of SEG){
    const L=CB(`lancamentos_${k}`), V=CB(`vendas_${k}`), O=CB(`oferta_${k}`);
    o[k]={name:nm, L, V, O,
      meses: join(O,roll4(V),(of,v)=>of/(v/12)),
      absorcao: join(join(roll4(V),roll4(L),(v,l)=>v-l),roll4(V),(a,v)=>a/v*100),
      reposicao: join(roll4(L),roll4(V),(l,v)=>l/v),
      vso: join(V,O,(v,of)=>v/(v+of)*100),
      vso12: join(roll4(V),O,(v,of)=>v/(v+of)*100),
      yoyL: yoy(roll4(L)), yoyV: yoy(roll4(V))};
  }
  o.share={L:CB('lancamentos_mcmv_share'),V:CB('vendas_mcmv_share'),O:CB('oferta_mcmv_share')};
  o.total={vso: join(CB('vendas'),CB('oferta'),(v,of)=>v/(v+of)*100)};
  return o;
}

/* semTable: linhas [nome, cálculo, série, formatador, status, referência, porquê, trimestral?] */
function semCard(title, note, rows, span=12){
  const card=el('div',{class:`card c${span}`}); card.append(el('h3',{},title)); if(note) card.append(el('p',{class:'note'},note));
  const t=el('table',{class:'sem'}); t.append(el('thead',{},el('tr',{},el('th',{},'Indicador e fórmula'),el('th',{class:'n'},'Atual'),el('th',{},'Leitura'),el('th',{class:'n'},'12 meses antes'),el('th',{},'Faixas e significado'))));
  const tb=el('tbody');
  for(const [nm,key,s,f,st,ref,why,isQ] of rows){ const L=last(s); const pv = isQ ? (s.length>4?s[s.length-5]:null) : (s.length>12?s[s.length-13]:null);
    const when = L ? 'Dado de ' + (isQ ? fmtQ(L[0]) : fmtYMlong(L[0])) : '';
    const info = INFO[key] || {f: key, m: why || ''};
    const tdName = el('td', {}, el('b', {}, nm, ' ', INFO[key] ? infoBadge(key, false) : null), el('div', {class: 'formula'}, el('b', {}, 'Fórmula: '), el('code', {}, info.f)), el('div', {class: 'ref'}, when));
    const tdRef = el('td', {}, el('div', {}, el('b', {}, 'Faixas: '), ref), el('div', {class: 'formula'}, el('b', {}, 'Significado: '), info.m, why && INFO[key] ? ' ' + why : ''));
    const tr = el('tr'); tr.append(tdName, el('td', {class: 'n'}, L ? f(L[1]) : '–'), el('td', {}, stPill(st)), el('td', {class: 'n'}, pv ? f(pv[1]) : '–'), tdRef); tb.append(tr); }
  t.append(tb); card.append(el('div',{class:'tablewrap'},t)); return card;
}
const lv = s => last(s)?.[1];
function segRows(m, k){
  // faixas diferentes por segmento: o MCMV gira rápido (subsídio + demanda reprimida); o MAP carrega estoque estrutural e é sensível a juros
  const th = k==='mcmv' ? {meses:[8,11], vso:[12,9], repo:[0.1,0.2]} : {meses:[10,16], vso:[9,6], repo:[0.1,0.25]};
  const sh = k==='mcmv' ? m.share : null;
  const rows=[
    ['Meses de estoque','meses',m.meses,v=>nf.format(v)+' m',status(lv(m.meses),th.meses),`< ${th.meses[0]} aquecido · > ${th.meses[1]} saturado`,'',true],
    ['VSO trimestral','vso',m.vso,v=>nf.format(v)+'%',status(lv(m.vso),th.vso,false),`> ${th.vso[0]}% favorável · < ${th.vso[1]}% desfavorável`,'',true],
    ['Absorção líquida 12m','absorcao',m.absorcao,v=>fmtPct(v),status(lv(m.absorcao),[0,-5],false),'> 0 favorável · < −5% desfavorável','',true],
    ['Taxa de reposição','reposicao',m.reposicao,v=>nf2.format(v)+'×',status(Math.abs((lv(m.reposicao)||1)-1),th.repo),`0,9–1,1 equilíbrio · > ${(1+th.repo[1]).toFixed(2).replace('.',',')} excesso de lançamentos`,'',true],
    ['Lançamentos 12m (var. anual)','yoyL',m.yoyL,v=>fmtPct(v),status(Math.abs(lv(m.yoyL)||0),[10,25]),'variação até ±10% estável · > 25% ciclo acelerando/freando','',true],
    ['Vendas 12m (var. anual)','yoyV',m.yoyV,v=>fmtPct(v),status(lv(m.yoyV),[0,-5],false),'> 0 favorável · < −5% desfavorável','',true],
  ];
  if(sh) rows.push(['Participação nos lançamentos','share',sh.L,v=>nf.format(v)+'%',status(lv(sh.L),[50,60]),'< 50% favorável · > 60% mercado dependente do programa','recorde da série (2019–) em 2T/26',true]);
  return rows;
}

function init(){
  document.getElementById('built').textContent=PAYLOAD.built_at;
  const nav=document.getElementById('nav'); VIEWS.forEach(v=>nav.append(el('button',{role:'tab','data-v':v.id,onclick:()=>{state.view=v.id;render();}},v.label)));
  const ufs=regionsOf('bcb_olinda','credito_contratacao_contratado_pf_sfh').sort((a,b)=>a==='BR'?-1:b==='BR'?1:(UF_NAMES[a]||a).localeCompare(UF_NAMES[b]||b));
  const ufSel=document.getElementById('uf'); ufs.forEach(u=>ufSel.append(el('option',{value:u},UF_NAMES[u]||u))); ufSel.value=state.uf; ufSel.onchange=()=>{state.uf=ufSel.value;render();};
  const cities=regionsOf('abecip','igmi_r').filter(c=>c!=='BR').sort((a,b)=>a.localeCompare(b));
  const citySel=document.getElementById('city'); cities.forEach(c=>citySel.append(el('option',{value:c},c))); if(!cities.includes(state.city)) state.city=cities[0]; citySel.value=state.city; citySel.onchange=()=>{state.city=citySel.value;render();};
  document.querySelectorAll('#range button').forEach(b=>b.onclick=()=>{state.years=+b.dataset.y;render();});
  const th=document.getElementById('theme'); try{ th.value=localStorage.getItem('theme')||''; }catch(e){} applyTheme(th.value); th.onchange=()=>{ applyTheme(th.value); try{localStorage.setItem('theme',th.value);}catch(e){} };
  const h=location.hash.slice(1); if(RENDER[h]) state.view=h;
  render();
  let t; window.addEventListener('resize',()=>{ clearTimeout(t); t=setTimeout(()=>{ document.querySelectorAll('.legend').forEach(l=>l.remove()); charts.forEach(c=>c.render(c.box)); },120); });
}
function applyTheme(v){ if(v) document.documentElement.setAttribute('data-theme',v); else document.documentElement.removeAttribute('data-theme'); }
init();
</script>
</body>
</html>
